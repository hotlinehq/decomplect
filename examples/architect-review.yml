name: Architect review

# Runs the decomplect skill on pull requests.
# Requires the ANTHROPIC_API_KEY secret (or swap for claude_code_oauth_token).
# Runs on every non-draft PR; to make it opt-in, uncomment the label condition below
# and add the "architecture" label to PRs that need a design review.

on:
  pull_request:
    types: [opened, synchronize, ready_for_review, labeled]

concurrency:
  group: architect-review-${{ github.event.pull_request.number }}
  cancel-in-progress: true

jobs:
  review:
    if: github.event.pull_request.draft == false
    # if: contains(github.event.pull_request.labels.*.name, 'architecture')
    runs-on: ubuntu-latest
    permissions:
      contents: read
      pull-requests: write
      id-token: write
    steps:
      - uses: actions/checkout@v6
        with:
          fetch-depth: 0

      - uses: anthropics/claude-code-action@v1
        with:
          anthropic_api_key: ${{ secrets.ANTHROPIC_API_KEY }}
          use_sticky_comment: true
          prompt: |
            REPO: ${{ github.repository }}
            PR NUMBER: ${{ github.event.pull_request.number }}
            BASE: ${{ github.event.pull_request.base.ref }}

            Use the decomplect skill (.claude/skills/decomplect/SKILL.md)
            in Review mode on this pull request. The PR branch is checked out.

            1. Read the PR title and body with `gh pr view` to find the problem statement.
            2. Read the change with `gh pr diff`, then read surrounding code and any
               consumers of changed public interfaces.
            3. Post ONE top-level comment with `gh pr comment` in the skill's output format.
            4. For blocking or major findings tied to a specific line, also add an inline
               comment with mcp__github_inline_comment__create_inline_comment (confirmed: true).

            Stay proportional to the size of the change. Do not approve or request changes.
          claude_args: |
            --allowedTools "Read,Grep,Glob,Bash(git diff:*),Bash(git log:*),Bash(gh pr view:*),Bash(gh pr diff:*),Bash(gh pr comment:*),mcp__github_inline_comment__create_inline_comment"
